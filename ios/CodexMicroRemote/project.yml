name: CodexMicroRemote
options:
  bundleIdPrefix: io.github.thislev
  deploymentTarget:
    iOS: "17.0"
targets:
  CodexMicroRemote:
    type: application
    platform: iOS
    sources: [Sources, Support/Assets.xcassets]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Codex Micro Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSBluetoothAlwaysUsageDescription: Codex Micro Remote turns your iPhone into a control surface for the Codex and Claude desktop apps over Bluetooth.
        NSMicrophoneUsageDescription: Codex Micro Remote records only while you hold a workspace microphone key so it can transcribe a prompt on this iPhone.
        NSSpeechRecognitionUsageDescription: Codex Micro Remote turns your spoken workspace prompts into text on this iPhone.
        NSLocalNetworkUsageDescription: Codex Micro Remote connects directly to your T3 Code server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes: [claude, t3code]
        UIBackgroundModes: [bluetooth-peripheral]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.thislev.codexmicroremote
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: Q6TQ7WFCK5
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.7"
      CURRENT_PROJECT_VERSION: "13"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
