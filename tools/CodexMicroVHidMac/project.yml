name: CodexMicroVHidMac
options:
  bundleIdPrefix: com.sidepulse
  deploymentTarget:
    macOS: "14.0"
targets:
  CodexMicroVHidMac:
    type: application
    platform: macOS
    sources: [../CodexMicroVHid]
    excludedSources: ["../CodexMicroVHid/vhid*", "../CodexMicroVHid/*.log", "../CodexMicroVHid/*.plist"]
    info:
      path: Support/InfoMac.plist
      properties:
        CFBundleDisplayName: CodexMicroVHidMac
        LSUIElement: YES
    entitlements:
      path: Support/entitlements.mac.plist
      properties:
        com.apple.developer.hid.virtual.device: YES
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sidepulse.codexmicrovhidmac
      DEVELOPMENT_TEAM: Q6TQ7WFCK5
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Support/entitlements.mac.plist
